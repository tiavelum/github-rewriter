name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer commit of the same pull request cancels the run of the older one
# (TL-34); a push to main gets a group of its own and is never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  test:
    # macOS runs the test under its own /bin/sh, bash 3.2, and the BSD tools;
    # Linux under dash and the GNU tools.
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install git-filter-repo
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            brew install git-filter-repo
          else
            sudo apt-get update -q && sudo apt-get install -y -q git-filter-repo
          fi

      # The test skips everything without git-filter-repo, so its absence
      # has to fail here rather than pass silently.
      - name: Show the shell, git, git-filter-repo and Python versions
        run: |
          ls -l /bin/sh
          git --version
          git filter-repo --version
          python3 --version

      - name: Test the rewrite scripts
        run: sh rewrite/test-history-rewrite.sh

      - name: Test the replay scripts
        run: sh replay/test-replay.sh

      # The formatters and the linters gate every Python and shell file
      # (TL-23, TL-33); their result does not depend on the runner, so one
      # runs them. shfmt takes its options from .editorconfig.
      - name: Check the format and lint of the Python files
        if: runner.os == 'Linux'
        run: |
          pipx run --spec ruff==0.16.6 ruff format --check .
          pipx run --spec ruff==0.16.6 ruff check .

      - name: Check the format of the shell files
        if: runner.os == 'Linux'
        run: pipx run --spec shfmt-py==3.13.0.3 shfmt -d $(git ls-files '*.sh')

      - name: Lint the shell files
        if: runner.os == 'Linux'
        run: pipx run --spec shellcheck-py==0.11.0.1 shellcheck $(git ls-files '*.sh')
