name: test

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

permissions:
  contents: read

# A newer push cancels the older run of its pull request (TL-34); a push to main and a
# label other than test-macos get a group of their own, so that they cancel no run.
concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.event.action == 'labeled' &&
    github.event.label.name != 'test-macos' && github.run_id ||
    github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  test:
    # Adding a label other than test-macos changes nothing to test.
    if: github.event.action != 'labeled' || github.event.label.name == 'test-macos'
    # macOS runners often queue for longer than the tests take, so a pull request
    # gets one only with the label test-macos (#75).
    strategy:
      fail-fast: false
      matrix:
        os: >-
          ${{ fromJSON((github.event_name != 'pull_request' ||
          contains(github.event.pull_request.labels.*.name, 'test-macos')) &&
          '["macos-15", "ubuntu-24.04"]' || '["ubuntu-24.04"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install git-filter-repo
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            brew install git-filter-repo
          else
            sudo apt-get update -q && sudo apt-get install -y -q git-filter-repo
          fi

      # The test skips everything without git-filter-repo, so its absence
      # has to fail here rather than pass silently.
      - name: Show the shell, git, git-filter-repo and Python versions
        run: |
          ls -l /bin/sh
          git --version
          git filter-repo --version
          python3 --version

      - name: Test the rewrite scripts
        run: sh rewrite/test-history-rewrite.sh

      # Homebrew's Python refuses pip install outside a virtual environment.
      - name: Test the replay scripts
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -q -r replay/tests/requirements.txt
          .venv/bin/pytest replay/tests

      # The formatters and the linters gate every Python and shell file (TL-23, TL-33);
      # their result does not depend on the runner, so Linux alone runs them.
      - name: Check the format and lint of the Python files
        if: runner.os == 'Linux'
        run: |
          pipx run --spec ruff==0.16.6 ruff format --check .
          pipx run --spec ruff==0.16.6 ruff check .

      - name: Check the format of the shell files
        if: runner.os == 'Linux'
        run: pipx run --spec shfmt-py==3.13.0.3 shfmt -d $(git ls-files '*.sh')

      - name: Lint the shell files
        if: runner.os == 'Linux'
        run: pipx run --spec shellcheck-py==0.11.0.1 shellcheck $(git ls-files '*.sh')
